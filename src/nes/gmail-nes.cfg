# gmail-nes.cfg -- the Gmail client on the NES: an MMC3 image (mapper 4)
# for the FujiNet NES cartridge. 128K PRG in sixteen 8K banks, 128K CHR-RAM,
# 8K WRAM. src/nes/neshw.h names every number here; keep the two in step.
#
#   bank 0      BOOT     at $8000 (R6): start-up, the flat screens
#   bank 1      NET      at $8000 (R6): src/net.c, clock.c, hwm.c
#   bank 2      INBOX    at $8000 (R6): the inbox screen
#   bank 3      READER   at $8000 (R6): the message reader
#   bank 4      COMPOSE  at $8000 (R6): the compose form and its keyboard
#   bank 5      ART      at $8000 (R6): the sprites' patterns, the palettes
#   bank 6-12   unused
#   bank 13     R7 at $A000, never switched: the font, form.c, compose.c,
#               main.c, date.c
#   bank 14-15  $C000-$FFFF, fixed: everything else, the claim ("FUJI" at
#               $FFF0, which keeps the cartridge's mailbox alive once the image
#               has booted) and the vectors
#
# Each bank's code and read-only data are separate segments (BOOT and
# BOOTRO, ...) only so that tools/nes/checkrom.py can scan the code for
# read-modify-writes of the mailbox without reading strings as instructions.
#
# One bank per screen, because a screen's code is only ever running while it
# is the screen that is up: the fixed half calls into a bank through
# bank_tramp (crt0.s), which maps it, calls, and puts back whatever was mapped
# before. The fixed banks and R7 are the 24K that every bank can call.
#
# RAM: zero page; $0200 the sprites (OAM DMA); $0300 the text stage the
# interrupt copies to the PPU; $0400 the attribute and palette shadows and
# the dirty marks; $0500 the body store's write ring; $0600-$07FF the C
# stack, which needs well under half of that. Everything else -- the text
# screen, the index, the form -- is in the cartridge's WRAM at $6000.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0200;
}
MEMORY {
    ZP:     file = "", start = $0000, size = $0100, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    B0:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B1:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B2:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B3:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B4:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    B5:     file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    PAD:    file = %O, start = $8000, size = $E000, fill = yes, fillval = $FF;
    B13:    file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    FIXED:  file = %O, start = $C000, size = $3FF0, fill = yes, fillval = $FF, define = yes;
    CLAIM:  file = %O, start = $FFF0, size = $000A, fill = yes, fillval = $FF;
    VECS:   file = %O, start = $FFFA, size = $0006, fill = yes;
    OAMRAM: file = "", start = $0200, size = $0100;
    STRAM:  file = "", start = $0300, size = $0100;
    LORAM:  file = "", start = $0400, size = $0100;
    RINGRAM: file = "", start = $0500, size = $0100;
    SRAM:   file = "", start = $0600, size = __STACKSIZE__, define = yes;
    RAM:    file = "", start = $6000, size = $2000, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    BOOT:     load = B0,     type = ro, define = yes, optional = yes;
    BOOTRO:   load = B0,     type = ro, define = yes, optional = yes;
    NETBANK:  load = B1,     type = ro, define = yes, optional = yes;
    NETRO:    load = B1,     type = ro, define = yes, optional = yes;
    INBOX:    load = B2,     type = ro, define = yes, optional = yes;
    INBOXRO:  load = B2,     type = ro, define = yes, optional = yes;
    READER:   load = B3,     type = ro, define = yes, optional = yes;
    READERRO: load = B3,     type = ro, define = yes, optional = yes;
    COMPOSE:  load = B4,     type = ro, define = yes, optional = yes;
    COMPOSERO: load = B4,    type = ro, define = yes, optional = yes;
    ART:      load = B5,     type = ro, define = yes, optional = yes;
    FONT:     load = B13,    type = ro, define = yes, align = $100;
    CODE2:    load = B13,    type = ro, define = yes, optional = yes;
    RODATA2:  load = B13,    type = ro, define = yes, optional = yes;
    STARTUP:  load = FIXED,  type = ro, define = yes;
    LOWCODE:  load = FIXED,  type = ro, optional = yes;
    ONCE:     load = FIXED,  type = ro, optional = yes;
    CODE:     load = FIXED,  type = ro, define = yes;
    RODATA:   load = FIXED,  type = ro, define = yes;
    DATA:     load = FIXED,  run = RAM, type = rw, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    OAM:      load = OAMRAM, type = bss;
    STAGE:    load = STRAM,  type = bss;
    LOBSS:    load = LORAM,  type = bss;
    RING:     load = RINGRAM, type = bss;
    CLAIM:    load = CLAIM,  type = ro;
    VECTORS:  load = VECS,   type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
